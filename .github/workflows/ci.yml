name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Puertas de calidad
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar
        run: pnpm install --frozen-lockfile

      - name: G1 · Tipos
        run: pnpm typecheck

      - name: G2 · Lint
        run: pnpm lint

      - name: G3 · Tests
        run: pnpm test

      - name: G4 · Contenido
        run: pnpm validate:content

      - name: G5 · Build
        run: pnpm build
